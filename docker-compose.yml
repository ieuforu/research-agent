services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: research
      POSTGRES_PASSWORD: research_dev
      POSTGRES_DB: research_agent
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U research -d research_agent']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
