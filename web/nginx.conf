server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Docker's embedded DNS. Without a resolver nginx resolves upstream hostnames
  # once at startup and caches the address, so a backend container that restarts
  # with a new IP leaves nginx answering 502 until it too is restarted.
  resolver 127.0.0.11 valid=10s ipv6=off;
  resolver_timeout 5s;

  # SPA fallback: every unknown path is a client route, not a 404.
  location / {
    try_files $uri $uri/ /index.html;
  }

  location /api/ {
    # Assigning the upstream to a variable forces nginx to re-resolve it through
    # the resolver above on every request instead of pinning the startup address.
    set $api_upstream "server:3000";
    proxy_pass http://$api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;

    # Server-sent events: buffering would defeat the point, and the default
    # read timeout would cut a long report off mid-stream.
    proxy_buffering off;
    proxy_cache off;
    proxy_set_header Connection '';
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    chunked_transfer_encoding on;
  }

  location = /healthz {
    access_log off;
    return 200 'ok';
    add_header Content-Type text/plain;
  }

  # Hashed asset filenames, so they can be cached forever.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
