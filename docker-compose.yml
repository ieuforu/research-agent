name: research-agent

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: research
      POSTGRES_PASSWORD: research_dev
      POSTGRES_DB: research_agent
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U research -d research_agent']
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      DATABASE_URL: postgresql://research:research_dev@postgres:5432/research_agent
      PORT: '3000'
      WEB_ORIGIN: http://localhost:8080
      # Required, no insecure default: `cp .env.example .env` and fill these in.
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env (see .env.example)}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:?set DEEPSEEK_API_KEY in .env (see .env.example)}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      # When set, GET /api/metrics requires `Authorization: Bearer $METRICS_TOKEN`.
      # Unset means the endpoint answers 404, so it is never exposed by accident.
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      SHUTDOWN_GRACE_MS: ${SHUTDOWN_GRACE_MS:-10000}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    ports:
      - '8080:80'
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1/healthz']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
